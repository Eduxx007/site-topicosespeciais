<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">Café NORD</title>
  <desc id="desc">Ilustração editorial de uma xícara de café quente e uma embalagem NORD.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9aa78"/>
      <stop offset="55%" stop-color="#a76339"/>
      <stop offset="100%" stop-color="#4f2b1c"/>
    </linearGradient>

    <linearGradient id="table" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#efe3d2"/>
      <stop offset="100%" stop-color="#c9a783"/>
    </linearGradient>

    <radialGradient id="coffee" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6e321d"/>
      <stop offset="100%" stop-color="#23110c"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#24150f" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#bg)"/>

  <circle cx="165" cy="175" r="95" fill="#ffdba6" opacity=".26" filter="url(#blur)"/>
  <circle cx="745" cy="250" r="150" fill="#ffddb6" opacity=".12" filter="url(#blur)"/>

  <path d="M0 660 C180 600 310 690 470 635 C620 580 760 555 900 590 L900 1125 L0 1125 Z"
        fill="url(#table)"/>

  <g transform="translate(525 225)" filter="url(#shadow)">
    <path d="M0 0 H205 Q230 0 230 24 V420 H0 Z" fill="#d4ad7b"/>
    <path d="M22 28 H208 V392 H22 Z" fill="#c69562" opacity=".38"/>
    <path d="M0 0 H205 L230 24 H24 Z" fill="#e3c39a"/>
    <text x="112" y="145" text-anchor="middle" font-family="Georgia, serif"
          font-size="54" letter-spacing="6" fill="#2a1710">NORD</text>
    <line x1="62" y1="170" x2="162" y2="170" stroke="#2a1710" stroke-width="2"/>
    <text x="112" y="207" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="18" letter-spacing="3" fill="#4c2d1f">CAFÉ ESPECIAL</text>
    <circle cx="112" cy="285" r="46" fill="none" stroke="#5b3928" stroke-width="3"/>
    <path d="M91 290 C100 263 124 263 133 290 C122 303 103 303 91 290 Z" fill="#5b3928"/>
  </g>

  <ellipse cx="445" cy="908" rx="290" ry="74" fill="#4a2e22" opacity=".15"/>

  <g transform="translate(155 515)" filter="url(#shadow)">
    <ellipse cx="250" cy="330" rx="248" ry="70" fill="#e9ddcf"/>
    <ellipse cx="250" cy="318" rx="214" ry="52" fill="#cdbdae"/>

    <path d="M74 77
             Q74 28 126 20
             H348
             Q398 28 398 78
             V256
             Q394 324 328 330
             H148
             Q83 323 78 257 Z"
          fill="#f7f0e8"/>

    <path d="M398 115
             Q486 112 500 174
             Q512 234 452 272
             Q423 290 393 270"
          fill="none" stroke="#f7f0e8" stroke-width="38" stroke-linecap="round"/>

    <ellipse cx="238" cy="78" rx="160" ry="49" fill="#d4c5b7"/>
    <ellipse cx="238" cy="77" rx="145" ry="39" fill="url(#coffee)"/>
    <ellipse cx="212" cy="67" rx="62" ry="14" fill="#a75d38" opacity=".3"/>
  </g>

  <g fill="none" stroke="#f2dfcc" stroke-width="8" stroke-linecap="round" opacity=".72">
    <path d="M365 500 C330 455 390 425 362 376 C342 342 376 322 370 286"/>
    <path d="M425 510 C395 462 460 430 430 382 C410 350 448 324 438 286"/>
    <path d="M485 505 C458 468 510 438 488 402 C468 369 501 342 494 310"/>
  </g>

  <g fill="#5a2e1c">
    <ellipse cx="136" cy="930" rx="24" ry="13" transform="rotate(-18 136 930)"/>
    <ellipse cx="201" cy="968" rx="25" ry="14" transform="rotate(24 201 968)"/>
    <ellipse cx="710" cy="935" rx="26" ry="14" transform="rotate(-28 710 935)"/>
    <ellipse cx="766" cy="886" rx="22" ry="13" transform="rotate(20 766 886)"/>
  </g>

  <rect x="0" y="0" width="900" height="1125" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
</svg>
